<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1F5FAE">
<title>Math Check</title>
<link rel="icon" href="logo-192.png" type="image/png">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
         background: #F6F7F3; color: #1D2040; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
  img { width: 112px; height: 112px; border-radius: 50%; }
  h1 { margin: 12px 0 4px; color: #1F5FAE; }
  #s { color: #62667E; max-width: 340px; margin: 8px auto; }
  button { margin-top: 12px; font: inherit; font-weight: 600; border: 0; border-radius: 12px; padding: 12px 22px; background: #1F5FAE; color: #fff; }
</style>
</head>
<body>
<div>
  <img src="logo-192.png" alt="">
  <h1>Math Check</h1>
  <p id="s">Подключаюсь к серверу проверки…</p>
  <button id="retry" type="button" hidden>Попробовать ещё раз</button>
</div>
<script>
// Адрес сервера меняется при каждом переподключении туннеля; сторож на компьютере записывает его в target.json
const REPO = "minipekarnia0305-max/math-check";
const s = document.getElementById("s"), retry = document.getElementById("retry");
retry.onclick = () => location.reload();

async function go() {
  try {
    const r = await fetch(`https://api.github.com/repos/${REPO}/contents/target.json?t=${Date.now()}`, {
      cache: "no-store", headers: { Accept: "application/vnd.github.raw+json" },
    });
    const { url } = await r.json();
    const alive = await fetch(`${url}/api/status`, { cache: "no-store" }).then((x) => x.ok).catch(() => false);
    if (alive) return location.replace(url);
    s.textContent = "Сервер проверки сейчас не отвечает. Если компьютер включён, подождите минуту — он переподключится сам.";
  } catch {
    s.textContent = "Не удалось подключиться. Проверьте интернет и попробуйте ещё раз.";
  }
  retry.hidden = false;
}
go();
</script>
</body>
</html>
